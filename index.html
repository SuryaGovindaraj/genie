<!DOCTYPE html>
<html>
<head>
    <title>Dropdown Example</title>
</head>
<body>

    <h2>Select a Topic</h2>

    <select id="mySelect" onchange="showText()">
        <option value="">-- Choose an option --</option>
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="java">Java</option>
    </select>

    <p id="result"></p>

    <script>
        function showText() {
            let choice = document.getElementById("mySelect").value;
            let text = "";

            if (choice === "html") {
                text = "HTML is used to create the structure of web pages.";
            } 
            else if (choice === "css") {
                text = "CSS is used to style web pages and make them attractive.";
            } 
            else if (choice === "java") {
                text = "Java is a powerful programming language used for web, mobile, and software development.";
            }

            document.getElementById("result").innerHTML = text;
        }
    </script>

</body>
</html>
